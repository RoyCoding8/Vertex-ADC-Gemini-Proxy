[project]
name = "vertex-adc-router"
version = "0.1.0"
description = "Local Gemini API proxy for Vertex AI using ADC"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "google-auth[requests]>=2.40,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "tmp/pytest_cache"
